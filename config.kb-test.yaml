# 知识库实测配置（M4 验收后的手动体验）
# 用法：pa --config config.kb-test.yaml
#
# 本文件启用知识库能力（默认 config.yaml 保持 kb.enabled: false 不动，
# 实测用独立配置，随时可删）。其余字段沿用默认值。
#
# API Key 仍只走环境变量：实测前先设置 $env:DEEPSEEK_API_KEY。

# 对话模型（沿用默认 deepseek-chat；提取回写也跟随此模型）
model: deepseek-chat
base_url: ""
data_dir: data
prompts_dir: config/prompts

tools:
  enabled:
    - get_time
    - read_file

kb:
  # 开启知识库总开关（D10 的默认关闭仅针对默认 config.yaml）
  enabled: true
  # 独立库文件，便于实测后整目录删除重来
  db_path: data/kb/knowledge.sqlite
  top_k: 5
  # 每轮主动召回条数：3（模型回答前注入相关片段）
  recall_limit: 3
  # 系统提示词注入轻量目录（库名/描述 + 何时用 kb_* 工具）
  catalog: true
  # 回答后提取回写：对话产生可复用知识自动入库
  extraction: true
