# Personal Agent runtime configuration.
# All values shown are the defaults; an omitted field uses its default.
# API keys are NEVER stored here — they only come from environment variables.

# Chat model to use.
model: deepseek-chat

# Optional OpenAI-compatible base URL. Empty means the provider default
# (https://api.deepseek.com).
base_url: ""

# Directory for runtime data (the session database pa.db lives here).
data_dir: data

# Directory of prompt section files (see config/prompts/README.md).
prompts_dir: config/prompts

# Tool execution policy (M3, design.md §5 / ADR 2026-08-18-m3-sandbox-scope).
# API keys never appear here — they only come from environment variables.
tools:
  # Whitelist: only these tool names may execute (未启用 ⇒ 拒绝执行).
  # Defaults to the read-only pair when absent.
  enabled:
    - get_time
    - read_file
  # Per-tool execute deadline wrapped around every Execute (Go duration).
  # run_command may override it via tools.run_command.timeout.
  timeout: 30s
  # Tool output over this many bytes is truncated; the full text is spilled to
  # <data_dir>/spill/<session>-<seq>.txt and the locator is returned to the
  # model (and logged into tool/result).
  output_limit: 65536
  # The sole execution-class tool (design.md §5 / D10). Off by default; only
  # when enabled: true is it registered and usable. Commands run as a single
  # line through cmd /C (Windows) or /bin/sh -c (elsewhere) in a fixed
  # working directory, with credential-shaped environment entries scrubbed.
  run_command:
    enabled: false
    # Optional per-tool timeout override; empty uses tools.timeout.
    # timeout: 60s
    # Fixed working directory; empty = the agent's process working directory.
    # workdir: ""

# Knowledge base capability (M4a kernel + M4b tools/recall + M4c extraction;
# design.md §8 / ADR 2026-08-18-m4-kb-architecture). Off by default (D10): when
# disabled no KB provider is initialized and no kb_* tool is registered or
# whitelisted. M4b adds the kb_search/kb_read/kb_add tools and the proactive
# recall orchestration; M4c adds the post-answer extraction writeback.
kb:
  # Master switch. false ⇒ kb never opens a database (默认关闭，不初始化) and the
  # kb_* tools are neither registered nor whitelisted.
  enabled: false
  # SQLite database file. Empty defaults to <data_dir>/kb/knowledge.sqlite
  # (the value shown here is that default at the default data_dir).
  db_path: data/kb/knowledge.sqlite
  # Default result count for a bounded Search/Recall (0/absent ⇒ 5).
  top_k: 5
  # Per-round proactive recall count injected into the model context at the
  # start of each turn (0 = proactive recall off; absent ⇒ 3).
  recall_limit: 3
  # Whether the lightweight knowledge-base catalog (name/description, no
  # bodies) is injected into the system prompt (absent ⇒ true).
  catalog: true
  # Whether the post-answer extraction writeback runs after each completed
  # turn, extracting durable knowledge from the conversation into the KB
  # (absent ⇒ true; false = skip extraction entirely). Extraction is
  # fail-open and never blocks the next answer.
  extraction: true

# Background-job capability (M5a; design.md §10 D5 / ADR 2026-08-18-m5-agent-core.md
# 决策 ①). Off by default (D10): when disabled no registry is initialized and no
# job_* tool is registered or whitelisted. job_start runs a command line as a
# background job (os/exec + context cancellation); job_status / job_read observe
# it, job_cancel cancels it, job_wait awaits it (bounded, default 30s). Job
# state/output reach the model through the tools' tool/result; job/start,
# job/status and job/done are logged as facts (D3). Jobs are in-memory only —
# a process restart clears them (no persistence in M5a).
jobs:
  # Master switch. false ⇒ no jobs.Local is created and the job_* tools are
  # neither registered nor whitelisted (默认关闭，不初始化).
  enabled: false
  # Cap on running+stopping jobs in one owner bucket (and the shared unowned
  # bucket); 0/absent ⇒ 10.
  max_concurrent_jobs_per_owner: 10

# Subagent capability (M5b; design.md §10 D2 / ADR 2026-08-18-m5-agent-core.md
# 决策 ②). Off by default (D10): when disabled no Runtime/SpawnProvider is
# initialized and no subagent_* tool is registered or whitelisted.
# subagent_spawn delegates a task to a brand-new child agent (independent
# session + independent loop, run in the background); subagent_status observes
# it (running, or the terminal result once settled), subagent_cancel cancels
# it, subagent_list enumerates a session's children. Child state/output reach
# the model through the tools' tool/result; subagent/start, subagent/end and
# subagent/report are logged as facts (D3). Children are in-memory only — a
# process restart clears them (no continuation in M5b).
subagent:
  # Master switch. false ⇒ no subagent runtime is created and the subagent_*
  # tools are neither registered nor whitelisted (默认关闭，不初始化).
  enabled: false
  # Default delegation depth cap applied by subagent_spawn when max_depth is
  # omitted; 0/absent ⇒ 8.
  max_depth: 8
  # Provider subagent_spawn delegates to. "spawn" (the in-process provider) is
  # the only one shipped in M5b; empty/absent ⇒ "spawn".
  default_provider: spawn
