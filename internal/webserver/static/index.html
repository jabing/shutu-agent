<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Login view (public shell): only shown when the backend actually answers
       401 (a web_server.token is configured). The token never leaves the
       Authorization header (ADR D-WEB2-B / D-WEB2-G). -->
  <div id="login" class="login hidden">
    <form class="login-card" id="login-form">
      <h1>Personal Agent</h1>
      <p class="muted">输入 web_server.token 进入工作台（令牌只存本机浏览器）</p>
      <p id="login-msg" class="err hidden"></p>
      <input type="password" id="tok" placeholder="Bearer token" autocomplete="current-password">
      <button type="submit">进入</button>
    </form>
  </div>

  <!-- dsh-style three-column workspace (ADR D-WEB2-F / D-WEB2-I): the frame is
       grid( sidebar | center | details ); the sidebar collapses to a 56px rail
       below 1024px; details stays mounted at 0 width. -->
  <div id="workspace" class="workspace hidden">
    <div id="frame" class="frame" data-sidebar-collapsed="false" data-details-collapsed="true">
      <!-- Sidebar column: session list (P1) + new button + foot nav. -->
      <section class="col-sidebar" aria-label="会话侧栏">
        <div class="sidebar-head">
          <div class="brand" id="brand">Personal&nbsp;Agent</div>
          <button id="new-session" class="btn-new" title="新建会话">＋ 新建</button>
        </div>
        <ul id="session-list" class="session-list"></ul>
        <nav class="sidebar-foot">
          <a href="#/settings" title="设置">⚙ 设置</a>
          <a href="#/kb" title="知识库">📚 知识库</a>
        </nav>
      </section>

      <!-- Center column: topbar + message stream + composer. -->
      <main class="col-center" aria-label="对话">
        <header class="topbar">
          <span id="cur-session" class="cur-session" title="当前会话"></span>
          <span id="mode-badge" class="mode-badge hidden" title="会话模式：改 config.yaml 重启生效"></span>
          <span class="spacer"></span>
          <span id="model-label" class="muted"></span>
          <a id="settings-link" class="btn-icon" href="#/settings" title="设置">⚙</a>
          <button id="theme-toggle" class="btn-icon" title="切换主题">☀️</button>
        </header>
        <div id="messages" class="messages" aria-live="polite"></div>
        <!-- Empty-state hero (探索未至之境) shown when there is no current
             session or the current session has no events. -->
        <div id="hero" class="hero hidden">
          <div class="hero-inner">
            <h1 class="hero-title">探索未至之境</h1>
            <p class="hero-sub muted">预览版</p>
          </div>
          <div class="hero-glow" aria-hidden="true"></div>
        </div>
        <!-- Composer card: auto-growing textarea + round send button. -->
        <div class="composer-card">
          <div class="composer">
            <div class="grow-wrap">
              <textarea id="composer-text" rows="1" placeholder="给智能体发消息…"></textarea>
              <div class="mirror" aria-hidden="true"></div>
            </div>
            <button id="composer-send" class="send-btn" title="发送" aria-label="发送">➤</button>
          </div>
        </div>
        <button id="scroll-bottom" class="scroll-bottom hidden" title="回到底部">↓</button>
      </main>

      <!-- Details column: reserved for the tool-call details panel (P1 keeps 0
           width; data not ready → stays mounted but invisible). -->
      <section class="col-details" aria-label="详情"></section>
    </div>
  </div>

  <!-- Settings page (M10 W2, ADR D-WEB2-D): read-only sanitized config view
       served by GET /api/config. No runtime editing — config changes take
       effect after a restart. -->
  <div id="settings" class="settings-page hidden">
    <header class="settings-top">
      <button id="settings-back" class="btn-ghost">← 返回聊天</button>
      <span class="spacer"></span>
      <button id="theme-toggle-settings" class="btn-icon" title="切换主题">☀️</button>
    </header>
    <div class="settings-body">
      <h1>设置</h1>
      <p class="muted">只读配置视图。修改 <code>config.yaml</code> 后重启生效（无运行时热改，ADR D-WEB2-D）。</p>
      <div id="settings-loading" class="muted">加载中…</div>
      <div id="settings-error" class="err hidden"></div>
      <div id="settings-groups" class="settings-groups hidden"></div>
    </div>
  </div>

  <!-- Placeholder pages (#/kb). -->
  <div id="placeholder" class="placeholder-page hidden">
    <button id="back" class="btn-ghost">← 返回聊天</button>
    <h1 id="ph-title"></h1>
    <p id="ph-note" class="muted"></p>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
